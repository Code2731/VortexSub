[package]
name = "echosub-translation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "translation-probe"
path = "src/probe.rs"

[dependencies]
echosub-pipeline-core = { path = "../pipeline-core" }
echosub-audio-core = { path = "../audio-core" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "macros"] }
