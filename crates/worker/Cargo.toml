[package]
name = "echosub-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
native-asr = ["echosub-asr-whisper/native"]
cuda = ["native-asr", "echosub-asr-whisper/cuda"]
native-vad = ["native-asr", "echosub-vad-silero/onnx"]

[dependencies]
serde_json = "=1.0.151"
echosub-audio-core = { path = "../audio-core" }
echosub-pipeline-core = { path = "../pipeline-core" }
echosub-asr-whisper = { path = "../asr-whisper" }
sha2 = "=0.10.9"
hound = "=3.5.1"
echosub-vad-silero = { path = "../vad-silero" }

[target.'cfg(windows)'.dependencies]
echosub-capture-windows = { path = "../capture-windows" }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_Storage_FileSystem"] }
